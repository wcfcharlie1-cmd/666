<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人知識庫 | Personal Knowledge Base</title>

  <!-- 字體：無襯線內文 + 等寬程式碼 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Highlight.js 程式碼高亮樣式（淺色 / 深色動態切換） -->
  <link id="hljs-theme-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
  <link id="hljs-theme-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" disabled />

  <!-- KaTeX 數學與反應箭頭公式渲染 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <!-- 全站自訂樣式（相對路徑） -->
  <link rel="stylesheet" href="./style.css" />

  <!-- 防止深色模式載入閃爍 -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('pkb-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- 手機版遮罩 -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <div class="layout">
    <!-- 左側導覽側邊欄 -->
    <aside id="sidebar" class="sidebar" aria-label="主題目錄">
      <div class="sidebar-header">
        <a href="#/" class="site-brand">
          <span class="brand-badge">KB</span>
          <span class="brand-title">個人知識庫</span>
        </a>
        <button id="sidebar-close" class="icon-btn mobile-only" aria-label="關閉選單">✕</button>
      </div>

      <div class="sidebar-search">
        <input
          type="search"
          id="search-input"
          placeholder="搜尋主題或分類..."
          autocomplete="off"
          aria-label="搜尋主題"
        />
      </div>

      <nav id="nav-tree" class="nav-tree" aria-label="筆記清單">
        <div class="nav-loading">載入目錄中...</div>
      </nav>
    </aside>

    <!-- 右側主內容區 -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-toggle" class="icon-btn mobile-only" aria-label="開啟目錄選單">☰</button>
          <span id="breadcrumb" class="breadcrumb">首頁</span>
        </div>
        <div class="topbar-right">
          <button id="theme-toggle" class="theme-btn" aria-label="切換深淺色模式" title="切換深色／淺色模式">
            <span id="theme-icon">🌙</span>
            <span id="theme-label" class="theme-label">深色</span>
          </button>
        </div>
      </header>

      <main class="content-container">
        <article id="markdown-body" class="markdown-body">
          <p class="status-text">正在載入筆記內容...</p>
        </article>
      </main>
    </div>
  </div>

  <!-- 輕量級 CDN 函式庫：Markdown 解析、程式碼高亮、公式渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- 主程式邏輯（相對路徑） -->
  <script src="./app.js"></script>
</body>
</html>
